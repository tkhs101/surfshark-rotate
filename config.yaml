# --------------------------------------------------------------
#  策略组
#   FAST     — 只含日韩（实测延迟最低的两档），url-test 自动挑快的
#   PROXY    — 轮换脚本操作的组，成员顺序即优先级
#   AUTOFALL — 降级链：PROXY 整个不健康时退到 DIRECT（由 rotate.py 显式切换，不是内核自动翻；恢复同样由 rotate.py 切回）
# --------------------------------------------------------------
proxy-groups:
  - name: "FAST"
    type: url-test
    proxies:
      - "JP 日本-东京"
      - "KR 韩国-首尔"
    url: "http://cp.cloudflare.com/"
    interval: 300
    tolerance: 50

  - name: "PROXY"
    type: select
    proxies:
      - "JP 日本-东京"
      - "KR 韩国-首尔"
      - "SG 新加坡"
      - "TW 台湾-台北"
      - "FAST"

  # --------------------------------------------------------------
  #  降级链：节点全挂时退到直连（rotate.py 显式切换），节点恢复后由 rotate.py 切回
  #
  #  【为什么必须有】WireGuard 私钥到期或节点全挂时，PROXY 是 select 组，
  #  mihomo 不会自动回退 —— opencode.ai 与 ip.sb 会直接连不上：
  #      dial PROXY ... context deadline exceeded
  #  也就是说密钥一过期，本项目唯一的产出（IP 轮换）就整体停摆，
  #  而除了翻 journal 没有别的信号能发现。
  #
  #  AUTOFALL 是 **select** 组而不是 fallback 组 —— 这个选择是刻意的，
  #  也是本次修复的核心：降级与恢复完全由 rotate.py 通过
  #  PUT /proxies/AUTOFALL 显式切换，内核不参与判断。
  #  PROXY 组本身不动，rotate.py 照旧操作它。
  #
  #  【为什么不能用 fallback】实测（真实内核 v1.19.32）：
  #    · fallback 的判定是**单样本布尔查表**。fallback.go 的 findAliveProxy()
  #      顺序遍历成员、返回第一个 AliveForTestUrl()==true 的，Now() 直接调它，
  #      中间没有任何计数器、迟滞或冷却 —— 隧道抖一下，下一条连接立刻走直连。
  #    · max-failed-times 名字像，但只作用于 onDialFailed（拨号失败路径），
  #      周期健康检查根本不走它 —— 照抄会得到「以为防住了其实没防住」
  #    · fixed 钉选成员同样压不住，存活检查照样覆盖它
  #    · relay 组已移除；fallback-filter 是 DNS 字段，不是代理组
  #  结论：没有任何配置开关能给 fallback 加去抖，而单样本在原理上也无法
  #  区分「瞬时抖动」和「真死」。所以调 timeout / interval 只能降低误判率，
  #  永远降不到零。
  #
  #  【实测代价】17 小时内 AUTOFALL 翻到 DIRECT 共 5 次（其中 3 次来自我自己的
  #  破坏密钥测试与密集压测），真实发生 1 次：01:20:25 有两条 opencode.ai 的
  #  连接以 AUTOFALL[DIRECT] 发出，即用本机 GCP 机房 IP 出网。那一刻没有任何
  #  轮换在跑，是纯粹的共享路径抖动。对本项目而言泄漏比失败更糟 —— 失败只是
  #  断一次，泄漏是把机房 IP 送到对方面前，而暴露机房 IP 恰恰是这个项目
  #  要避免的事。改成 select 之后，这 5 次翻转一次都不会再发生。
  #
  #  【降级与恢复】
  #    降级：rotate.py 连续 2 轮取不到出口 IP 才切到 DIRECT
  #          （DEGRADE_AFTER_FAILS，约 10 分钟），要求故障持续至少
  #          一个完整轮换周期 —— 私钥到期会持续数天必然满足，瞬时抖动不会。
  #    恢复：判据走控制面（节点 delay 探测），完全不经过 AUTOFALL 与数据面。
  #          用 AUTOFALL 自己的状态判断恢复会自证循环。
  #          换私钥必然要 restart mihomo，on-mihomo-up.sh 在那里负责恢复。
  - name: "AUTOFALL"
    type: select
    proxies:
      - "PROXY"
      - "DIRECT"

# --------------------------------------------------------------
#  分流
#    规则顺序 = 安全优先级，倒数第二条是 VPS 专属加固。
#
#    这里指向 AUTOFALL 而不是 PROXY，是为了让「节点全挂」有个明确的降级出口：
#    私钥到期时 opencode.ai 会退到直连（还能用，只是出口变回本机），
#    而不是直接连不上。rotate.py 会在同一轮发现降级并停掉轮换定时器，
#    详见 AUTOFALL 组的注释。
#
#    【ip.sb 故意挂在 PROXY 上，不跟 opencode.ai 一起走 AUTOFALL】
#    ip.sb 是 rotate.py 唯一的出口 IP 测量通道，测量的前提是它反映的是被测对象。
#    若它也挂在 AUTOFALL 上，降级时它会走直连、返回本机自己的公网 IP，
#    而 rotate.py 正在轮次进行中（开头的 is_degraded() 只查轮次开始那一刻），
#    就会把这个本机 IP 当成「换到的新出口」写进 last_ip 并打印「完成」。
#    失败方向从「响亮失败」变成了「静默谎报成功」，比连不上更难察觉。
#    挂在 PROXY 上之后：隧道正常时探测行为完全不变；隧道死时没有 DIRECT 退路，
#    探测必然失败 → exit_ip() 返回 None → 走 fail_streak → 判定降级。
#    install.sh 的能力校验会检查这一条，防止日后被顺手改回去。
# --------------------------------------------------------------
rules:
  # 【VPS 专属】SSH 永远直连。这是 route-exclude-address 之外的第二道保险：
  # 万一排除列表没覆盖到某条路径，这条规则仍能保住你的远程连接。
  - DST-PORT,22,DIRECT
  - DOMAIN-SUFFIX,opencode.ai,AUTOFALL
  # 仅供轮换脚本查出口 IP。必须挂在 PROXY 而不是 AUTOFALL，理由见上方注释。
  - DOMAIN-SUFFIX,ip.sb,PROXY
  - MATCH,DIRECT