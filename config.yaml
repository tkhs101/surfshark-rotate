# ==============================================================
#  Surfshark 亚洲节点 — mihomo 配置（Linux / VPS 版）
#
#  整机分流：只有 opencode.ai 与 ip.sb 走代理并每 5 分钟换一次出口 IP，
#  其余全部直连。与 Windows 版分流规则一致。
#
#  下方 secret、route-exclude-address、WG_PRIVATE_KEY 三处占位符由 install.sh 填充，
#  本文件不可直接使用。
#
#  【私钥不进版本库】private-key 是你 Surfshark 账号的真实私钥，4 个节点共用同一个。
#  它由 install.sh 从 surfshark.key 文件或 SURFSHARK_WG_KEY 环境变量注入，
#  surfshark.key 已列入 .gitignore。public-key 是公钥，公开无妨。
# ==============================================================

mixed-port: 7897
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: info
ipv6: false
unified-delay: true

# 控制接口只监听本机。rotate.py 用它切节点和热重载。
# 绝对不要改成 0.0.0.0 —— 那等于把节点控制权挂到公网。
external-controller: 127.0.0.1:9097
secret: "@@SECRET@@"

# --------------------------------------------------------------
#  TUN：整机分流在这里生效
# --------------------------------------------------------------
tun:
  enable: true
  # Linux 有原生协议栈，官方文档明确 system 栈"更稳定、资源占用更低"。
  # （Windows 上用 gvisor 是因为 Windows TUN 驱动栈不同，这里不照搬。）
  stack: system
  device: Mihomo
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
  # MTU 由 install.sh 按本机实际网卡 MTU 推算填入：网卡 MTU − 60（WireGuard 开销）。
  # 写死是错的 —— 各云厂商网卡 MTU 不同（1500/1460/1400 都有），
  # 照抄别处的值会导致外层包超网卡 MTU 而分片，或直接黑洞。
  # 注意：占位符不能加引号。写成 "@@MTU@@" 的话，替换后会变成字符串 "1400"，
  # 而 mihomo 要求 uint32，直接报 cannot unmarshal !!str into uint32。
  # 与下面 proxy 的 mtu 必须同值。
  mtu: @@MTU@@
  # 【保 SSH 的关键】把 VPS 自身地址排除在 TUN 之外。
  # 这样 SSH 流量根本不进 mihomo —— 即使内核进程崩了，SSH 也不会被劫持。
  # install.sh 会填入：本机全部 IPv4、默认路由源地址、公网出口 IP、
  # 以及几家云厂商的元数据地址（避免 TUN 劫持 169.254.169.254 拿不到凭据）。
  route-exclude-address:
@@ROUTE_EXCLUDE@@

dns:
  enable: true
  ipv6: false
  # 与 Windows 版保持一致，不改成 fake-ip。
  # 实测 redir-host 在本方案下工作正常，没有证据就不动它。
  enhanced-mode: redir-host
  nameserver:
    - 223.5.5.5
    - 1.1.1.1
  fallback:
    - 8.8.8.8

# --------------------------------------------------------------
#  sniffer：从 TLS SNI / HTTP Host / QUIC SNI 还原域名
#
#  【为什么必须开】本配置用 enhanced-mode: redir-host。该模式下 mihomo
#  不保留「域名」这回事，应用最终是以 IP 建连的。DOMAIN-SUFFIX 这类规则
#  要匹配，mihomo 唯一的依据是「自己此前处理过该域名的 DNS 查询」在内存里
#  建立的 IP->域名映射。只要有一次解析绕开了 mihomo，域名规则就静默失效：
#
#    · 全新安装后系统 DNS 缓存里已有该域名的旧记录（TTL 未到）
#    · 应用自带 DoH / DoT，绕开系统解析器
#    · 应用长时间使用已缓存的 IP
#    · systemd-resolved 还没把 mihomo 的 198.18.0.2 纳入 nameserver
#    · 系统解析器落在 route-exclude-address 的排除网段里，DNS 根本不进 TUN
#
#  失败方向是「放行」而不是「拒绝」：没有任何报错，journalctl 里只有一行
#  match Match using DIRECT，不主动去看根本发现不了。而本项目的 IP 轮换
#  只对走 PROXY 的流量有意义 —— 分流一旦失效，轮换就是空转。
#
#  sniffer 直接从连接首包还原域名，不依赖 DNS 查询是否经过 mihomo，
#  纯 IP 建连也能正确命中域名规则。
#
#  与 redir-host 不冲突，可以并存：这里不改 redir-host 的选择，
#  只补上它缺失的那个前提条件。
#
#  实测（同一台机器、同一时刻，仅 sniffer 一项不同）：
#    关闭：match Match using DIRECT                     ← 以纯 IP 匹配，落到兜底规则
#    开启：match DomainSuffix(opencode.ai) using PROXY  ← 域名被还原，规则命中
# --------------------------------------------------------------
sniffer:
  enable: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
    QUIC:
      ports: [443, 8443]
  # 纯 IP 建连（metadata.host 为空）时也嗅探。
  # 【本项目的关键开关】没有这一项，上面 opencode.ai 那个场景不会生效。
  parse-pure-ip: true
  # 对「已经通过 redir-host 映射拿到域名」的连接也强制嗅探，以 SNI 为准。
  # 覆盖的是另一类同源失效：映射存在却指向别的域名（CDN 共享 IP、映射过期）。
  # 注意它不是「用 mihomo 的 DNS 重新解析」—— 那是 override-destination 的作用。
  force-dns-mapping: true
  # 嗅探到的域名只用于规则匹配，不用它改写实际访问的目标地址：
  # mihomo 仍然去连客户端原本要连的那个 IP，分流语义与开启 sniffer 前完全一致。
  # 必须显式写出来 —— 不写时它取 Go 零值 false 恰好是我们要的，但那是默认值
  # 而不是契约；显式声明才不会因将来默认值变化而静默改变行为。
  #（别写成 override-source，mihomo v1.19.32 没有这个键，会被静默忽略。）
  override-destination: false
  # 跳过这些域名的嗅探。本配置除 opencode.ai / ip.sb 外全部 MATCH,DIRECT，
  # 所以这里对分流结果没有任何影响，纯粹是不做无用的解析。
  # 一律用 "+." 后缀写法：mihomo 的 "*" 只匹配一级子域且不匹配裸域名，
  # 写成 "*.msftconnecttest.com" 会漏掉 msftconnecttest.com 本身。
  skip-domain:
    - "+.internal"
    - "google.internal"
    - "localhost.ptlogin2.qq.com"
    - "+.srv.nintendo.net"
    - "+.stun.playstation.net"
    - "+.xboxlive.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"

